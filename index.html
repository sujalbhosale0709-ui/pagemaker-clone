<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Adobe PageMaker 7.0 - Multi-Page DTP Edition</title>
<style>
  * { box-sizing: border-box; user-select: none; font-family: 'Tahoma', 'Arial', sans-serif; font-size: 12px; }
  body { margin: 0; padding: 0; background-color: #808080; overflow: hidden; display: flex; flex-direction: column; height: 100vh; width: 100vw; }
  
  /* Menu Bar */
  .menu-bar { background: #d4d0c8; border-bottom: 1px solid #808080; display: flex; padding: 2px 4px; z-index: 300; overflow-x: auto; }
  .menu-item { padding: 3px 7px; cursor: pointer; white-space: nowrap; }
  .menu-item:hover { background: #0a246a; color: white; }
  .dropdown { display: none; position: fixed; top: 24px; background: #d4d0c8; border: 2px solid; border-color: #ffffff #808080 #808080 #ffffff; min-width: 180px; z-index: 400; box-shadow: 2px 2px 4px rgba(0,0,0,0.4); color: black; }
  .dropdown.show { display: block; }
  .dropdown-item { padding: 5px 12px; cursor: pointer; display: flex; justify-content: space-between; }
  .dropdown-item:hover { background: #0a246a; color: white; }
  .dropdown-divider { border-top: 1px solid #808080; border-bottom: 1px solid #ffffff; margin: 2px 0; }

  /* Toolbar */
  .toolbar { background: #d4d0c8; border-top: 1px solid #ffffff; border-bottom: 1px solid #808080; padding: 3px 6px; display: flex; gap: 5px; align-items: center; z-index: 200; overflow-x: auto; white-space: nowrap; }
  .btn { background: #d4d0c8; border: 1px solid; border-color: #ffffff #808080 #808080 #ffffff; padding: 2px 7px; cursor: pointer; }
  .btn:active { border-color: #808080 #ffffff #ffffff #808080; }

  /* Workspace & Rulers */
  .workspace-container { display: flex; flex: 1; position: relative; overflow: hidden; }
  .ruler-corner { width: 18px; height: 18px; background: #d4d0c8; border-right: 1px solid #000; border-bottom: 1px solid #000; position: absolute; top: 0; left: 0; z-index: 10; }
  .ruler-h { height: 18px; background: #ffffff; border-bottom: 1px solid #000; position: absolute; top: 0; left: 18px; right: 0; display: flex; align-items: flex-end; font-size: 9px; padding-left: 40px; }
  .ruler-v { width: 18px; background: #ffffff; border-right: 1px solid #000; position: absolute; top: 18px; left: 0; bottom: 0; display: flex; flex-direction: column; font-size: 9px; padding-top: 20px; }

  /* Pasteboard & Page */
  .pasteboard { flex: 1; background: #808080; overflow: auto; padding: 30px 30px 110px 80px; display: flex; justify-content: flex-start; align-items: flex-start; margin-top: 18px; margin-left: 18px; }
  @media (min-width: 850px) { .pasteboard { justify-content: center; padding: 40px 40px 100px 40px; } }
  .page { width: 595px; height: 842px; min-width: 595px; min-height: 842px; background: #ffffff; box-shadow: 4px 4px 0px #404040; position: relative; border: 1px solid #000; overflow: hidden; transform-origin: top left; }
  .margin-guide { position: absolute; top: 40px; left: 40px; right: 40px; bottom: 40px; border: 1px solid #ff69b4; pointer-events: none; z-index: 1; }
  .master-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; opacity: 0.95; }

  /* Classic PageMaker 14-Tool Floating Box */
  .toolbox { position: absolute; top: 24px; left: 22px; width: 60px; background: #d4d0c8; border: 2px solid; border-color: #ffffff #808080 #808080 #ffffff; z-index: 150; box-shadow: 2px 2px 5px rgba(0,0,0,0.4); }
  .palette-header { background: linear-gradient(90deg, #0a246a, #a6caf0); color: white; font-size: 10px; padding: 2px 4px; font-weight: bold; cursor: move; }
  .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; }
  .tool-btn { height: 25px; background: #d4d0c8; border: 1px solid; border-color: #ffffff #808080 #808080 #ffffff; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 13px; font-weight: bold; }
  .tool-btn.active { background: #a8a8a8; border-color: #808080 #ffffff #ffffff #808080; color: #0a246a; }

  /* Floating Colors Palette */
  .color-palette { position: absolute; top: 24px; right: 12px; width: 110px; background: #d4d0c8; border: 2px solid; border-color: #ffffff #808080 #808080 #ffffff; z-index: 150; display: none; box-shadow: 2px 2px 5px rgba(0,0,0,0.4); }
  @media (min-width: 850px) { .color-palette { display: block; } }
  .swatch-list { padding: 3px; display: flex; flex-direction: column; gap: 2px; }
  .swatch { display: flex; align-items: center; gap: 5px; padding: 2px 4px; cursor: pointer; font-size: 11px; }
  .swatch:hover { background: #0a246a; color: white; }
  .swatch-box { width: 12px; height: 12px; border: 1px solid #000; }

  /* Control Palette */
  .control-palette { position: fixed; bottom: 26px; left: 0; right: 0; background: #d4d0c8; border-top: 2px solid #ffffff; z-index: 250; display: flex; align-items: center; padding: 4px 8px; gap: 7px; overflow-x: auto; white-space: nowrap; box-shadow: 0 -2px 5px rgba(0,0,0,0.3); }
  @media (min-width: 850px) {
    .control-palette { left: 95px; right: auto; bottom: 32px; border: 2px solid; border-color: #ffffff #808080 #808080 #ffffff; }
  }
  select, input[type="number"], input[type="color"] { border: 1px solid #808080; background: #ffffff; padding: 2px; font-size: 12px; height: 24px; }

  /* Classic PageMaker Bottom Page Switcher Bar */
  .page-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 26px; background: #d4d0c8; border-top: 1px solid #808080; z-index: 300; display: flex; align-items: center; padding: 0 6px; gap: 3px; overflow-x: auto; }
  .page-tab { background: #e0ded8; border: 1px solid #000; padding: 1px 7px; cursor: pointer; font-size: 11px; font-weight: bold; display: flex; align-items: center; border-bottom-left-radius: 3px; border-bottom-right-radius: 3px; }
  .page-tab.master { background: #ffe4b5; color: #8b0000; }
  .page-tab.active { background: #000000; color: #ffffff; }
  .add-page-btn { background: #d4d0c8; border: 1px solid; border-color: #ffffff #808080 #808080 #ffffff; padding: 1px 6px; cursor: pointer; font-size: 11px; margin-left: 5px; }

  /* Page Elements */
  .pm-element { position: absolute; z-index: 10; touch-action: none; }
  .pm-element.selected { outline: 1px dashed #0000ff; }
  .pm-element.crop-mode { outline: 2px solid #ff0000; }
  
  .handle { width: 8px; height: 8px; background: #000; position: absolute; display: none; z-index: 20; }
  .pm-element.selected .handle { display: block; }
  .pm-element.crop-mode .handle { background: #ff0000; }
  .handle.nw { top: -4px; left: -4px; cursor: nw-resize; }
  .handle.ne { top: -4px; right: -4px; cursor: ne-resize; }
  .handle.sw { bottom: -4px; left: -4px; cursor: sw-resize; }
  .handle.se { bottom: -4px; right: -4px; cursor: se-resize; }
  .handle.n { top: -4px; left: calc(50% - 4px); cursor: n-resize; }
  .handle.s { bottom: -4px; left: calc(50% - 4px); cursor: s-resize; }
  .handle.w { top: calc(50% - 4px); left: -4px; cursor: w-resize; }
  .handle.e { top: calc(50% - 4px); right: -4px; cursor: e-resize; }

  .text-content { width: 100%; height: 100%; outline: none; user-select: text; padding: 4px; line-height: 1.4; overflow: hidden; }
  .img-wrapper { width: 100%; height: 100%; overflow: hidden; position: relative; pointer-events: none; }
  .pm-image { width: 100%; height: 100%; object-fit: fill; }
  .shape-svg { width: 100%; height: 100%; display: block; pointer-events: none; }

  /* Print Container for All Pages */
  #print-all-container { display: none; }
  @media print {
    body > *:not(#print-all-container) { display: none !important; }
    #print-all-container { display: block !important; background: white; }
    .print-page { width: 595px; height: 842px; position: relative; page-break-after: always; overflow: hidden; }
    .print-page .margin-guide, .print-page .handle { display: none !important; }
    .print-page .pm-element { outline: none !important; }
  }
</style>
</head>
<body onclick="closeMenus()">

  <!-- Menu Bar -->
  <div class="menu-bar">
    <div class="menu-item" onclick="toggleMenu(event, 'menu-file')"><u>F</u>ile</div>
    <div class="menu-item" onclick="toggleMenu(event, 'menu-edit')"><u>E</u>dit</div>
    <div class="menu-item" onclick="toggleMenu(event, 'menu-layout')"><u>L</u>ayout</div>
    <div class="menu-item" onclick="toggleMenu(event, 'menu-element')"><u>E</u>lement</div>
    <div class="menu-item" onclick="toggleMenu(event, 'menu-view')"><u>V</u>iew</div>
    <div class="menu-item" onclick="toggleColorPalette()"><u>W</u>indow (Colors)</div>
  </div>

  <!-- Dropdowns -->
  <div id="menu-file" class="dropdown" style="left: 4px;">
    <div class="dropdown-item" onclick="newDocument()"><span>New Publication</span><span>Ctrl+N</span></div>
    <div class="dropdown-item" onclick="document.getElementById('project-input').click()"><span>Open...</span><span>Ctrl+O</span></div>
    <div class="dropdown-item" onclick="saveProject()"><span>Save Project</span><span>Ctrl+S</span></div>
    <div class="dropdown-divider"></div>
    <div class="dropdown-item" onclick="triggerPlaceImage()"><span>Place Image...</span><span>Ctrl+D</span></div>
    <div class="dropdown-divider"></div>
    <div class="dropdown-item" onclick="printAllPages()"><span>Print All Pages / PDF</span><span>Ctrl+P</span></div>
  </div>

  <div id="menu-edit" class="dropdown" style="left: 38px;">
    <div class="dropdown-item" onclick="duplicateSelected()"><span>Duplicate Box</span><span>Ctrl+V</span></div>
    <div class="dropdown-item" onclick="deleteSelected()"><span>Clear Box</span><span>Del</span></div>
  </div>

  <div id="menu-layout" class="dropdown" style="left: 75px;">
    <div class="dropdown-item" onclick="insertNewPage()"><span>Insert Pages...</span></div>
    <div class="dropdown-item" onclick="removeCurrentPage()"><span>Remove Current Page</span></div>
